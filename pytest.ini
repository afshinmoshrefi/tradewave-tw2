[pytest]
testpaths = tests
pythonpath = . web appserver/appserver
addopts = -ra --strict-markers
markers =
    db: marks tests that hit the temporary Postgres tradewave_test DB
    unit: pure-Python tests with no external state
    tara_draft_rewrite: run Tara with the engine-draft rewrite on (TW-TASK-0035)
filterwarnings =
    ignore::DeprecationWarning
