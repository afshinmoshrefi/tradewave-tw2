[pytest]
testpaths = tests
pythonpath = . web appserver/appserver
addopts = -ra --strict-markers
markers =
    db: marks tests that hit the temporary Postgres tradewave_test DB
    unit: pure-Python tests with no external state
    tara_rewrite_off: the engine-reply lead is switched off, as shipped by default (no provider call on an engine route)
    tara_draft_rewrite: the test drives the engine-reply lead itself instead of the hostile stub (TW-TASK-0035)
filterwarnings =
    ignore::DeprecationWarning
