<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="TradeWave - AI-scored seasonal pattern analytics for traders." />

  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <title>TradeWave - AI Scored Patterns</title>

  <!-- TODO(prod-cutover): paste Google Analytics gtag.js snippet here -->

  <style>
    html, body, #root { margin: 0; padding: 0; height: 100%; }
    body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>

  <!-- TW2 server-side substitution stub. Flask's app_index() route in web/app.py
       replaces this empty <header id="main-header"> at request time with the
       real TW2 header template. Webpack preserves the literal opening/closing
       tags through minification so the server-side string replace finds them.
       The React source now uses `?.clientHeight ?? 0` for safe DOM access, so
       a 0-height stub is harmless if Flask substitution is ever bypassed. -->
  <header id="main-header" style="display:none"></header>

  <div id="root">
    <div id="tw-bootstrap-loader" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0f0a15;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
      <div style="font-size:32px;font-weight:800;background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#a855f7 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:24px;">TradeWave</div>
      <div style="width:48px;height:48px;border:3px solid rgba(255,255,255,0.1);border-top-color:#a855f7;border-radius:50%;animation:tw-spin 1s linear infinite;"></div>
      <div style="margin-top:16px;font-size:14px;color:#9ca3af;">Loading&hellip;</div>
      <style>@keyframes tw-spin{to{transform:rotate(360deg);}}</style>
    </div>
  </div>
</body>
</html>
