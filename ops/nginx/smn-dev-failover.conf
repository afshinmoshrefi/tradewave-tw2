# Temporary static recovery for the approved SMN Dev edition.
# The primary SMN Dev VM is 192.168.1.180; this vhost runs on TW2 .176.
server {
    listen 80;
    listen [::]:80;
    server_name smn-dev.trxstat.com;
    include /etc/nginx/snippets/security_headers.conf;
    root /var/www/smn-dev-recovery/current;
    index index.html;
    location = / { return 302 /editions/2026-09-08/; }
    location ~ /\. { return 404; }
    location ~ \.py$ { return 404; }
    location / { try_files $uri $uri/ =404; }
}

