# Deliberately omits query arguments and the raw request line so credentials never
# enter nginx access logs. Install under /etc/nginx/conf.d before enabling the
# TradeWave vhosts.
log_format tw_noargs '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                     '"$http_user_agent"';
