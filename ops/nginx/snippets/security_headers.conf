# TradeWave 2 - Shared HTTP security headers.
# Included into the top-level server block of each vhost.
# Notes:
#   - 'unsafe-inline' is required in style-src + script-src because the
#     marketing pages have many inline <style> blocks and a small auth-swap
#     <script> in the shared _tw_header.html partial. Removing those would
#     require a refactor; for now we allow inline but lock down everything
#     else.
#   - Stripe + WorkOS are explicitly allowlisted for connect/frame/form.
#   - accounts.google.com (script/connect/frame) + www.googleapis.com (connect)
#     are required by the wave-viewer's "Add to Google Calendar" feature (GIS
#     OAuth popup + Calendar API insert). Removing them silently breaks it -
#     the GIS <script> is blocked and the button throws (2026-07-04 incident).
#   - www.youtube-nocookie.com is limited to frame-src for the Wave Viewer
#     Getting Started video. The player is not allowed to load scripts or make
#     API calls in the top-level application origin.
#   - X-Frame-Options is kept alongside frame-ancestors for browsers that
#     don't implement CSP3 (older Safari, etc.).

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "interest-cohort=(), camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.stripe.com\")" always;

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https://api.stripe.com https://api.workos.com https://*.authkit.app https://smn-dev.trxstat.com https://accounts.google.com https://www.googleapis.com; frame-src 'self' https://js.stripe.com https://checkout.stripe.com https://*.authkit.app https://accounts.google.com https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://checkout.stripe.com https://api.workos.com https://*.authkit.app; object-src 'none'; upgrade-insecure-requests" always;
