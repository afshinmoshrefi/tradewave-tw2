# Deny access to any dotfile path under the document root, except the
# ACME / well-known directories we actually want to expose. Returns 404
# (not 403) so we don't leak that the path was filesystem-blocked vs.
# simply absent.
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}
