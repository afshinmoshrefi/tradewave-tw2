# TradeWave 2.0 - Developer portal nginx vhosts
# ============================================================================
# Three server blocks for the public developer-facing surface:
#   1) api-dev.trxstat.com        -> JSON API gateway  (gunicorn 127.0.0.1:8088)
#   2) mcp-dev.trxstat.com        -> MCP Streamable HTTP server (python 127.0.0.1:9090)
#   3) developers-dev.trxstat.com -> static portal     (/var/www/developers)
#
# Modeled on the existing dev vhost (/etc/nginx/sites-enabled/tradewave):
# reuses the same shared snippets (security_headers.conf, dotfile_deny.conf,
# tw2-proxy-headers.conf) and the same upstream + location style.
#
# Each public hostname is fronted by the single 'tw2' cloudflared tunnel ->
# http://localhost:80 -> nginx routes by server_name. The two services bind
# loopback only; nginx is their only ingress.
#
# ----------------------------------------------------------------------------
# PER-ENV HOSTNAMES - swap server_name on each box (everything else is identical):
#   dev      api-dev.trxstat.com    mcp-dev.trxstat.com    developers-dev.trxstat.com
#   staging  api-stage.trxstat.com  mcp-stage.trxstat.com  developers-stage.trxstat.com
#   prod     api.tradewave.ai       mcp.tradewave.ai       developers.tradewave.ai
# ----------------------------------------------------------------------------

upstream tw2_apiserver {
    server 127.0.0.1:8088;
    keepalive 16;
}

upstream tw2_mcpserver {
    server 127.0.0.1:9090;
    keepalive 64;
}

# Per-client edge budgets for the MCP authentication and RPC surface.  This file
# is included from nginx's http{} context, where limit_*_zone directives belong.
# The MCP vhost below trusts CF-Connecting-IP only from the loopback cloudflared
# hop, so $binary_remote_addr is the public caller rather than one shared 127.0.0.1.
# Capacity floor: 20 simultaneous ChatGPT conversations can each perform the
# five-request release-gate sequence (initialize + initialized + tools/list +
# first tool call + session cleanup = 100 requests) inside the burst budget, with
# headroom for the strict contract probe immediately before it. OpenAI/NAT egress can
# share one public IP, so the burst and connection caps must not be sized as if
# one IP meant one user.  10r/s sustained, burst 160, and 120 connections still
# put a finite bound on one abusive source.
limit_req_zone  $binary_remote_addr zone=tw2_mcp_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=tw2_mcp_conn_per_ip:10m;

# ============================================================================
# 1) JSON API gateway  -  api-dev.trxstat.com
# ============================================================================
server {
    # Tunnel origin only: cloudflared targets http://localhost:80. Do not expose
    # an origin listener that can bypass Cloudflare TLS/WAF over public IPv4/IPv6.
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name api-dev.trxstat.com;

    # Security headers (shared across vhosts).
    include /etc/nginx/snippets/security_headers.conf;
    # Block /.git, /.env, /.htaccess, etc. (allows /.well-known for ACME).
    include /etc/nginx/snippets/dotfile_deny.conf;

    client_max_body_size 5M;

    # Block source maps from being publicly served (defense-in-depth).
    location ~ \.map$ {
        return 404;
    }

    # Health check - cheap, unauthenticated; used by the tunnel/monitors.
    location /healthz {
        proxy_pass http://tw2_apiserver;
        include /etc/nginx/snippets/tw2-proxy-headers.conf;
        access_log off;
    }

    # The versioned API. A wide /v1/scan can legitimately run toward the gunicorn
    # timeout (120s), so the edge must out-wait the app (125s > 120s) - the shared
    # snippet's 60s read timeout would cut such requests mid-work into an HTML 504.
    # Headers are inlined (not the snippet) because nginx rejects a duplicate
    # proxy_read_timeout in one location.
    location /v1/ {
        proxy_pass http://tw2_apiserver;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 125s;
        proxy_connect_timeout 5s;
    }

    # Everything else -> the gunicorn API gateway.
    location / {
        proxy_pass http://tw2_apiserver;
        include /etc/nginx/snippets/tw2-proxy-headers.conf;
    }

    # API clients must never get an HTML error page: when nginx ITSELF generates the
    # edge failure (upstream down -> 502, edge read budget exceeded -> 504), answer in
    # the API's JSON error envelope. App-generated statuses pass through untouched
    # (proxy_intercept_errors stays off).
    error_page 502 = @api_upstream_down;
    error_page 504 = @api_upstream_timeout;

    location @api_upstream_timeout {
        default_type application/json;
        return 504 '{"error":{"code":"upstream_timeout","message":"The gateway timed out waiting for the API. Retry shortly; narrow the request (fewer markets, a lower limit) if it persists."}}';
    }

    location @api_upstream_down {
        default_type application/json;
        return 502 '{"error":{"code":"upstream_unavailable","message":"The API is temporarily unavailable. Retry shortly."}}';
    }

    access_log /var/log/nginx/tradewave-api.access.log;
    error_log  /var/log/nginx/tradewave-api.error.log;
}

# ============================================================================
# 2) MCP server (Streamable HTTP)  -  mcp-dev.trxstat.com
# ============================================================================
# SSE-framed Streamable HTTP responses need an unbuffered, long-lived HTTP/1.1 connection with no
# 'Connection: keep-alive' rewrite, so this block does NOT use the shared
# tw2-proxy-headers.conf snippet (which sets a 60s read timeout). It sets the
# same forwarding headers inline plus streaming-friendly tuning.
server {
    # cloudflared origin only (http://localhost:80).
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name mcp-dev.trxstat.com;

    # Security headers (shared across vhosts).
    include /etc/nginx/snippets/security_headers.conf;
    # Block /.git, /.env, /.htaccess, etc. (allows /.well-known for ACME).
    include /etc/nginx/snippets/dotfile_deny.conf;

    # cloudflared is the only ingress.  Recover the real public IP for logging and
    # per-client limits, but never trust this header from a non-loopback peer.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    client_max_body_size 1M;
    client_body_timeout 15s;
    client_header_timeout 15s;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    location / {
        # Count a long-lived SSE-framed response as one connection, not as repeated
        # requests.  The high connection budget supports NATs and many parallel
        # ChatGPT conversations while still bounding one abusive source.
        limit_req zone=tw2_mcp_per_ip burst=160 nodelay;
        limit_conn tw2_mcp_conn_per_ip 120;

        proxy_pass http://tw2_mcpserver;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Public traffic arrived over HTTPS at Cloudflare even though the tunnel
        # hop into nginx is HTTP.  Passing $scheme here produced an http:// OAuth
        # discovery redirect for the trailing-slash form.  This tunnel-only vhost
        # must therefore preserve the public scheme explicitly.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # Streamable HTTP settings, including SSE-framed streaming responses.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 60s;
        chunked_transfer_encoding off;
    }

    access_log /var/log/nginx/tradewave-mcp.access.log;
    error_log  /var/log/nginx/tradewave-mcp.error.log;
}

# ============================================================================
# 3) Developer portal (static)  -  developers-dev.trxstat.com
# ============================================================================
# Docroot assembled by the portal generators into /var/www/developers/:
#   /            index.html, pricing.html, mcp.html, use-cases.html
#   /docs/       the 7 html + openapi.yaml/json + postman collection
#   /docs/.well-known/mcp.json
#   /learn/      site/api_learn/out/
#   /playground/ site/api_playground/out/
server {
    # cloudflared origin only (http://localhost:80).
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name developers-dev.trxstat.com;

    # Security headers (shared across vhosts).
    include /etc/nginx/snippets/security_headers.conf;
    # Block /.git, /.env, /.htaccess, etc. (allows /.well-known for ACME).
    include /etc/nginx/snippets/dotfile_deny.conf;

    root /var/www/developers;
    index index.html;

    client_max_body_size 5M;

    # Block source maps from being publicly served (defense-in-depth).
    location ~ \.map$ {
        return 404;
    }

    # MCP discovery + ACME: serve real files under /.well-known/ (the
    # dotfile_deny snippet already allows the well-known prefix).
    location /.well-known/ {
        try_files $uri =404;
    }

    # Cacheable static assets.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API spec / collection downloads.
    location ~* \.(yaml|yml|json)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Docs section.
    location /docs/ {
        try_files $uri $uri/ $uri.html =404;
    }

    # Learn section.
    location /learn/ {
        try_files $uri $uri/ $uri.html =404;
    }

    # Interactive playground.
    location /playground/ {
        try_files $uri $uri/ $uri.html =404;
    }

    # Branded 404.
    error_page 404 /404.html;
    location = /404.html {
        root /var/www/developers;
        internal;
    }

    # Catch-all: $uri.html for static pages, else 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    access_log /var/log/nginx/tradewave-developers.access.log;
    error_log  /var/log/nginx/tradewave-developers.error.log;
}
