[Service]
# Stable installer-owned reboot/manual-start fence. It protects both the exact
# legacy first-migration unit and every immutable unit while a durable release
# transaction is active or incomplete.
ExecCondition=+/usr/bin/python3.13 -I -B -S /usr/local/libexec/tradewave-mcp-start-guard.py /var/lib/tradewave/mcp-release-transactions/active /run/lock/tradewave/mcp-release.lock
