[Service]
# Stable installer-owned guard.  An active paired API+MCP transaction blocks
# gateway activation across controller death, manual restart, and reboot.
ExecCondition=+/usr/bin/python3.13 -I -B -S /usr/local/libexec/tradewave-mcp-start-guard.py /var/lib/tradewave/mcp-release-transactions/active /run/lock/tradewave/mcp-release.lock
